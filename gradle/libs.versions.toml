[versions]
# Toolchain, exact versions.
agp = "9.3.0"
kotlin = "2.4.10"
composeMultiplatform = "1.11.1"
coroutines = "1.11.0"
# JSON for the server wire format. Compile-time codegen, no reflection, and it
# works on Kotlin/Native.
serialization = "1.11.0"
androidxActivityCompose = "1.13.0"
androidxLifecycle = "2.11.0"
camerax = "1.6.1"

# Android SDK levels. minSdk 28 (Android 9) is the first release with
# StrongBox (setIsStrongBoxBacked).
compileSdk = "37"
minSdk = "28"
targetSdk = "37"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
# Test-only: runTest for the suspend approval flow.
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
# 1.1.0 is the newest stable release; 1.2 and 1.4 are alpha. The
# authentication prompt stays on a stable version.
androidx-biometric = { module = "androidx.biometric:biometric", version = "1.1.0" }
# BiometricPrompt needs a FragmentActivity host. Declared here instead of
# relying on biometric's transitive dependency.
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version = "1.8.9" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
# QR enrollment. The foss flavor may carry no Google or proprietary code, or
# F-Droid cannot build it. CameraX is Apache-2.0 and needs no Play Services.
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
# QR decoder for both flavors. Apache-2.0 pure Java despite the com.google
# group id, with no Android or Play dependency. ML Kit is proprietary and
# would keep the foss flavor out of F-Droid.
zxing-core = { module = "com.google.zxing:core", version = "3.5.4" }
# Push for the foss flavor. UnifiedPush connects to a distributor the user
# chooses (ntfy and others) and has no Google or Play dependency. 3.x decrypts
# Web Push (RFC 8291) itself, using its one transitive dependency,
# com.google.crypto.tink:tink (Apache-2.0, pure Java). It also adds the
# WAKE_LOCK permission.
unifiedpush-connector = { module = "org.unifiedpush.android:connector", version = "3.3.3" }
# Embedded FCM distributor, play flavor only, as a fallback. It registers with
# FCM's Web Push endpoint using only the deployment's VAPID key, with no
# Firebase project and no gateway. Its intent-filter priority is -500, so any
# installed distributor replaces it. Its c2dm receiver shares the APK with
# firebase-messaging's: test for duplicate or lost delivery before a release.
unifiedpush-embedded-fcm = { module = "org.unifiedpush.android:embedded-fcm-distributor", version = "3.1.0" }
# Push for the play flavor only. FCM is proprietary, so the foss flavor
# carries none of it. The BOM keeps the play-services versions consistent.
firebase-bom = { module = "com.google.firebase:firebase-bom", version = "33.7.0" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
jetbrains-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Since AGP 9.0, com.android.library does not work with the Kotlin
# Multiplatform plugin.
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
# Turns google-services.json into the play flavor's FCM config. androidApp
# applies it only when that file is present. The file is not committed.
google-services = { id = "com.google.gms.google-services", version = "4.4.2" }
